    const STORAGE_KEY_MENUS = 'menupicker_custom_menus_v1';
    const STORAGE_KEY_HISTORY = 'menupicker_history_v1';

    let menuList = [];
    let historyList = [];
    let currentCategory = 'all';
    let isSpinning = false;
    let soundEnabled = true;

    // --- Web Audio Tick & Win Sound Generator ---
    function playTickSound() {
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400 + Math.random() * 200, ctx.currentTime);

        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.05);
      } catch (e) {}
    }

    function playWinFanfare() {
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();

        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);

          gain.gain.setValueAtTime(0, ctx.currentTime + idx * 0.1);
          gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + idx * 0.1 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 0.5);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(ctx.currentTime + idx * 0.1);
          osc.stop(ctx.currentTime + idx * 0.1 + 0.5);
        });
      } catch (e) {}
    }

    // --- DOM References ---
    const elBtnPick = document.getElementById('btn-pick');
    const elBtnPickLabel = document.getElementById('btn-pick-label');
    const elSlotStrip = document.getElementById('slot-strip');
    const elWinnerFrame = document.getElementById('winner-frame');
    const elWinnerActions = document.getElementById('winner-actions');
    const elLinkNaverMap = document.getElementById('link-naver-map');
    const elLinkBaemin = document.getElementById('link-baemin');

    const elCategoryChips = document.getElementById('category-chips');
    const elMenuChipsWrapper = document.getElementById('menu-chips-wrapper');
    const elMenuCountBadge = document.getElementById('menu-count-badge');
    const elAddMenuForm = document.getElementById('add-menu-form');
    const elInputMenuName = document.getElementById('input-menu-name');
    const elInputMenuCategory = document.getElementById('input-menu-category');
    const elInputMenuEmoji = document.getElementById('input-menu-emoji');
    const elBtnResetDefault = document.getElementById('btn-reset-default');
    const elHistoryList = document.getElementById('history-list');

    const elBtnSoundToggle = document.getElementById('btn-sound-toggle');
    const elIconSoundOn = document.getElementById('icon-sound-on');
    const elIconSoundOff = document.getElementById('icon-sound-off');
    const elBtnThemeToggle = document.getElementById('btn-theme-toggle');
    const elIconThemeSun = document.getElementById('icon-theme-sun');
    const elIconThemeMoon = document.getElementById('icon-theme-moon');

    // --- Data Load & Save ---
    function loadStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_MENUS);
        menuList = saved ? JSON.parse(saved) : [...DEFAULT_MENUS];

        const savedHistory = localStorage.getItem(STORAGE_KEY_HISTORY);
        historyList = savedHistory ? JSON.parse(savedHistory) : [];
      } catch (e) {
        menuList = [...DEFAULT_MENUS];
      }
    }

    function saveStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_MENUS, JSON.stringify(menuList));
        localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(historyList));
      } catch (e) {}
    }

    // --- Render Menu List & History ---
    function renderMenuList() {
      const filtered = currentCategory === 'all' 
        ? menuList 
        : menuList.filter(m => m.category === currentCategory);

      elMenuCountBadge.textContent = filtered.length;

      if (filtered.length === 0) {
        elMenuChipsWrapper.innerHTML = `
          <p class="text-xs text-slate-400 italic p-2">이 카테고리에 등록된 메뉴가 없습니다.</p>
        `;
        return;
      }

      elMenuChipsWrapper.innerHTML = filtered.map(m => `
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100/90 dark:bg-slate-900/80 border border-slate-200/80 dark:border-slate-800 text-xs font-semibold text-slate-700 dark:text-slate-300 group hover:border-orange-400 transition-all">
          <span>${m.emoji}</span>
          <span>${escapeHtml(m.name)}</span>
          <button onclick="deleteMenu('${m.id}')" title="삭제" class="ml-1 text-slate-400 hover:text-rose-500 opacity-60 group-hover:opacity-100 transition-opacity">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </span>
      `).join('');

      if (window.lucide) lucide.createIcons();
    }

    function renderHistory() {
      if (historyList.length === 0) {
        elHistoryList.innerHTML = `<span class="text-slate-400 italic">아직 기록이 없습니다.</span>`;
        return;
      }
      elHistoryList.innerHTML = historyList.slice(0, 5).map(item => `
        <span class="px-2.5 py-1 rounded-lg bg-orange-500/10 text-orange-600 dark:text-orange-400 font-bold shrink-0 flex items-center gap-1">
          <span>${item.emoji}</span>
          <span>${escapeHtml(item.name)}</span>
        </span>
      `).join('');
    }

    window.deleteMenu = function(id) {
      if (isSpinning) return;
      menuList = menuList.filter(m => m.id !== id);
      saveStorage();
      renderMenuList();
    };

    // Category name label mapper
    function categoryNameMap(cat) {
      const map = {
        korean: '한식 🍲',
        chinese: '중식 🇨🇳',
        japanese: '일식 🍣',
        western: '양식 🍕',
        snack: '분식 떡볶이',
        dessert: '카페/디저트 🍰'
      };
      return map[cat] || '추천 맛집';
    }

    // --- Slot Machine Spin Logic ---
    function pickRandomMenu() {
      if (isSpinning) return;

      const candidates = currentCategory === 'all'
        ? menuList
        : menuList.filter(m => m.category === currentCategory);

      if (candidates.length === 0) {
        alert('추천할 메뉴 후보가 없습니다. 메뉴를 등록해주세요!');
        return;
      }

      isSpinning = true;
      elBtnPick.disabled = true;
      elBtnPickLabel.textContent = '메뉴 고르는 중... 🤤';
      elWinnerFrame.classList.add('opacity-0');
      elWinnerActions.classList.add('hidden');

      // Reset transform if any
      elSlotStrip.style.transform = 'translateY(0)';

      // Pick winner
      const winner = candidates[Math.floor(Math.random() * candidates.length)];

      let step = 0;
      const totalSteps = 24;
      let delay = 35;

      function spinStep() {
        const tempItem = candidates[Math.floor(Math.random() * candidates.length)];
        
        elSlotStrip.innerHTML = `
          <div class="slot-item flex flex-col items-center justify-center gap-2 transform transition-all">
            <span class="text-7xl sm:text-8xl select-none filter drop-shadow-md">${tempItem.emoji}</span>
            <span class="text-2xl sm:text-3xl font-extrabold font-display text-slate-800 dark:text-amber-300">
              ${escapeHtml(tempItem.name)}
            </span>
          </div>
        `;
        playTickSound();

        step++;
        if (step < totalSteps) {
          // Gradually slow down near end
          if (step > totalSteps - 8) delay += 25;
          if (step > totalSteps - 4) delay += 45;
          setTimeout(spinStep, delay);
        } else {
          onSpinFinish(winner);
        }
      }

      spinStep();
    }

    function onSpinFinish(winner) {
      isSpinning = false;
      elBtnPick.disabled = false;
      elBtnPickLabel.textContent = '다른 메뉴 다시 뽑기! 🎲';
      elWinnerFrame.classList.remove('opacity-0');

      // Render Final Winner Display Card Prominently
      elSlotStrip.innerHTML = `
        <div class="winner-display flex flex-col items-center justify-center gap-2 animate-pop text-center p-2">
          <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-gradient-to-r from-orange-500 to-amber-500 text-white text-xs sm:text-sm font-bold shadow-md tracking-wider">
            🎉 오늘의 추천 메뉴 당첨!
          </div>
          <span class="text-7xl sm:text-8xl select-none filter drop-shadow-xl transform hover:scale-110 transition-transform my-1">
            ${winner.emoji}
          </span>
          <h3 class="text-3xl sm:text-4xl font-black font-display text-slate-900 dark:text-amber-300 tracking-tight">
            ${escapeHtml(winner.name)}
          </h3>
          <span class="text-xs px-3 py-1 rounded-lg bg-amber-200/80 dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-bold border border-amber-300/50 dark:border-slate-700">
            #${categoryNameMap(winner.category)}
          </span>
        </div>
      `;

      // Play victory sound & confetti
      playWinFanfare();
      if (window.confetti) {
        confetti({
          particleCount: 100,
          spread: 80,
          origin: { y: 0.6 }
        });
      }

      // Add to history
      historyList.unshift(winner);
      if (historyList.length > 10) historyList.pop();
      saveStorage();
      renderHistory();

      // Update Search Action Links
      const searchKeyword = encodeURIComponent(winner.name);
      elLinkNaverMap.href = `https://map.naver.com/p/search/${searchKeyword}`;
      elLinkBaemin.href = `https://m.baemin.com/` || `https://www.google.com/search?q=${searchKeyword}+배달`;
      elWinnerActions.classList.remove('hidden');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[m]);
    }

    // --- Category Filter Handler ---
    elCategoryChips.addEventListener('click', (e) => {
      const chip = e.target.closest('.cat-chip');
      if (!chip || isSpinning) return;

      document.querySelectorAll('.cat-chip').forEach(c => {
        c.className = 'cat-chip px-3.5 py-1.5 rounded-full text-xs font-semibold transition-all bg-slate-100 dark:bg-slate-800/80 text-slate-600 dark:text-slate-400 hover:bg-slate-200';
      });
      chip.className = 'cat-chip px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-orange-500 text-white shadow-md shadow-orange-500/20';

      currentCategory = chip.dataset.category;
      renderMenuList();
    });

    // --- Add Custom Menu ---
    elAddMenuForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = elInputMenuName.value.trim();
      const category = elInputMenuCategory.value;
      const emoji = elInputMenuEmoji.value;

      if (!name) return;

      const newMenu = {
        id: 'custom_' + Date.now(),
        name,
        category,
        emoji
      };

      menuList.unshift(newMenu);
      saveStorage();
      renderMenuList();

      elInputMenuName.value = '';
    });

    // Reset default menus
    elBtnResetDefault.addEventListener('click', () => {
      if (confirm('모든 메뉴를 기본 리스트로 초기화할까요?')) {
        menuList = [...DEFAULT_MENUS];
        saveStorage();
        renderMenuList();
      }
    });

    // --- Theme & Sound Toggles ---
    function initTheme() {
      const isDark = localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        document.documentElement.classList.add('dark');
        elIconThemeSun.classList.remove('hidden');
        elIconThemeMoon.classList.add('hidden');
      } else {
        document.documentElement.classList.remove('dark');
        elIconThemeSun.classList.add('hidden');
        elIconThemeMoon.classList.remove('hidden');
      }
    }

    elBtnThemeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.theme = isDark ? 'dark' : 'light';
      elIconThemeSun.classList.toggle('hidden', !isDark);
      elIconThemeMoon.classList.toggle('hidden', isDark);
    });

    elBtnSoundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      elIconSoundOn.classList.toggle('hidden', !soundEnabled);
      elIconSoundOff.classList.toggle('hidden', soundEnabled);
    });

    // --- Init App ---
    function init() {
      initTheme();
      loadStorage();
      renderMenuList();
      renderHistory();
      if (window.lucide) lucide.createIcons();
    }

    elBtnPick.addEventListener('click', pickRandomMenu);
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
